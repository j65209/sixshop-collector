name: collect-sixshop-orders

on:
  schedule:
    - cron: "0 23 * * *"  # 매일 UTC 23:00 = KST 08:00
  workflow_dispatch:        # 수동 실행 가능

concurrency:
  group: collect-sixshop
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run collector
        env:
          SIXSHOP_EMAIL: ${{ secrets.SIXSHOP_EMAIL }}
          SIXSHOP_PASSWORD: ${{ secrets.SIXSHOP_PASSWORD }}
          SIXSHOP_EMAIL_CLEARTYPE: ${{ secrets.SIXSHOP_EMAIL_CLEARTYPE }}
          SIXSHOP_PASSWORD_CLEARTYPE: ${{ secrets.SIXSHOP_PASSWORD_CLEARTYPE }}
          SIXSHOP_EMAIL_PP: ${{ secrets.SIXSHOP_EMAIL_PP }}
          SIXSHOP_PASSWORD_PP: ${{ secrets.SIXSHOP_PASSWORD_PP }}
          NAVER_CLIENT_ID_PP: ${{ secrets.NAVER_CLIENT_ID_PP }}
          NAVER_CLIENT_SECRET_PP: ${{ secrets.NAVER_CLIENT_SECRET_PP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          STATE_SHEET_NAME: ${{ vars.STATE_SHEET_NAME || '_state' }}
          HEADLESS: "true"
        run: npx tsx src/index.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results
            *.png
            *.html
          if-no-files-found: ignore
          retention-days: 5
