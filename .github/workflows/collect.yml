name: collect-sixshop-orders

on:
  schedule:
    # GitHub schedule이 9시간씩 지연되는 패턴 관찰됨 — KST 08:00 보장 X.
    # 외부 cron 서비스(cron-job.org)에서 KST 08:00에 workflow_dispatch 트리거가 진짜 보장.
    # 아래 schedule은 외부 cron 실패 시 fallback (한 번이라도 돌면 OK).
    - cron: "0 23 * * *"  # UTC 23:00 = KST 08:00 (정시)
    - cron: "0 1 * * *"   # UTC 01:00 = KST 10:00 (fallback)
  workflow_dispatch:

concurrency:
  group: collect-sixshop
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run collector
        env:
          SIXSHOP_EMAIL: ${{ secrets.SIXSHOP_EMAIL }}
          SIXSHOP_PASSWORD: ${{ secrets.SIXSHOP_PASSWORD }}
          SIXSHOP_EMAIL_CLEARTYPE: ${{ secrets.SIXSHOP_EMAIL_CLEARTYPE }}
          SIXSHOP_PASSWORD_CLEARTYPE: ${{ secrets.SIXSHOP_PASSWORD_CLEARTYPE }}
          SIXSHOP_EMAIL_PP: ${{ secrets.SIXSHOP_EMAIL_PP }}
          SIXSHOP_PASSWORD_PP: ${{ secrets.SIXSHOP_PASSWORD_PP }}
          NAVER_CLIENT_ID_PP: ${{ secrets.NAVER_CLIENT_ID_PP }}
          NAVER_CLIENT_SECRET_PP: ${{ secrets.NAVER_CLIENT_SECRET_PP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          STATE_SHEET_NAME: ${{ vars.STATE_SHEET_NAME || '_state' }}
          HEADLESS: "true"
        run: npx tsx src/index.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results
            *.png
            *.html
          if-no-files-found: ignore
          retention-days: 5

  pp-smartstore:
    # 2단계 — PP 스마트스토어 동기화 + PP 재고마스터 작성
    # 네이버 SmartStore API가 사장님 PC IP 화이트리스트라 self-hosted runner에서만 가능
    needs: collect
    runs-on: [self-hosted, windows, brightbeed]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (skip Playwright browsers)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --ignore-scripts
        shell: cmd

      - name: Run PP SmartStore sync + refresh master
        env:
          SIXSHOP_EMAIL_PP: ${{ secrets.SIXSHOP_EMAIL_PP }}
          SIXSHOP_PASSWORD_PP: ${{ secrets.SIXSHOP_PASSWORD_PP }}
          NAVER_CLIENT_ID_PP: ${{ secrets.NAVER_CLIENT_ID_PP }}
          NAVER_CLIENT_SECRET_PP: ${{ secrets.NAVER_CLIENT_SECRET_PP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          STATE_SHEET_NAME: ${{ vars.STATE_SHEET_NAME || '_state' }}
        run: npm run vm-pp-cycle
        shell: cmd
